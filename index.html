<style>
:root{
  --paper:#ECF0F1; --paper-2:#F8FAFA; --paper-3:#DDE4E8; --rule:rgba(70,118,186,.12); --margin:#D8353B;
  --ink:#1B2642; --ink-2:#55607A; --ink-3:#8791A6; --line:#C8D1D9;
  --accent:#C8102E; --accent-2:#9B0C23; --accent-soft:rgba(200,16,46,.08); --on-accent:#fff;
  --blue:#1D4DA3; --good:#23805A; --gold:#B7791F;
  --slate:#24302B; --slate-2:#2F3C36; --wood-1:#A0744B; --wood-2:#6C4A2C;
  --chalk:#F3F1E9; --chalk-dim:rgba(243,241,233,.34); --chalk-mid:rgba(243,241,233,.7); --chalk-y:#F6D768; --chalk-r:#FF8F8F; --chalk-g:#A9E0B6;
  --key:#FBFCFD; --key-edge:#B4BEC8; --key-text:#1B2642; --key-sub:#7B859A;
  --f-p:#DB5579; --f-r:#DC922C; --f-m:#2A9A6B; --f-i:#3F71D6; --f-t:#9166CF;
  --gutter:calc(clamp(18px,4vw,56px) + 30px);
  --serif:'Martel','Noto Serif Devanagari',Georgia,serif;
  --sans:'Mukta','Noto Sans Devanagari','Nirmala UI',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#121928; --paper-2:#192235; --paper-3:#233049; --rule:rgba(130,165,225,.055); --margin:#B3343A;
    --ink:#E7EBF3; --ink-2:#A6B0C5; --ink-3:#76819A; --line:#2A3653;
    --accent:#E5364F; --accent-2:#B42238; --accent-soft:rgba(229,54,79,.13);
    --blue:#89ABF2; --good:#5CC48F; --gold:#E3B341;
    --slate:#1D2622; --slate-2:#27332D;
    --key:#1F2940; --key-edge:#0C1220; --key-text:#E7EBF3; --key-sub:#8E99B0;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#121928; --paper-2:#192235; --paper-3:#233049; --rule:rgba(130,165,225,.055); --margin:#B3343A;
  --ink:#E7EBF3; --ink-2:#A6B0C5; --ink-3:#76819A; --line:#2A3653;
  --accent:#E5364F; --accent-2:#B42238; --accent-soft:rgba(229,54,79,.13);
  --blue:#89ABF2; --good:#5CC48F; --gold:#E3B341;
  --slate:#1D2622; --slate-2:#27332D;
  --key:#1F2940; --key-edge:#0C1220; --key-text:#E7EBF3; --key-sub:#8E99B0;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;background-color:var(--paper);background-image:repeating-linear-gradient(to bottom,transparent 0 35px,var(--rule) 35px 36px);color:var(--ink);font:400 17px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;top:0;bottom:0;left:clamp(18px,4vw,56px);width:2px;background:var(--margin);opacity:.5;pointer-events:none;z-index:0}
[lang="ne"]{font-feature-settings:normal}
a{color:var(--blue)}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
[hidden]{display:none!important}
kbd{font-family:var(--sans)}
.muted{color:var(--ink-2);font-size:15px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--paper) 90%,transparent);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-in{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:18px;padding:8px 18px 8px var(--gutter)}
.brand{display:flex;flex-direction:column;text-decoration:none;color:var(--ink);line-height:1.1;flex-shrink:0}
.brand b{font:900 25px/1.3 var(--serif)}
.brand small{font:500 12.5px/1 var(--sans);color:var(--ink-2)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.tabs::-webkit-scrollbar{display:none}
.tab{position:relative;display:block;padding:6px 12px 9px;border-radius:8px;text-decoration:none;color:var(--ink-2);white-space:nowrap}
.tab:hover{background:var(--paper-3)}
.tab .ne{display:block;font:700 16px/1.45 var(--serif);color:var(--ink)}
.tab .en{display:block;font:500 12.5px/1.1 var(--sans)}
.tab[aria-current="page"]::after{content:"";position:absolute;left:12px;right:12px;bottom:2px;height:3px;border-radius:3px;background:var(--accent)}
.icon-btn{appearance:none;border:1.5px solid var(--line);background:var(--paper-2);color:var(--ink);width:42px;height:42px;border-radius:10px;display:grid;place-items:center;cursor:pointer;flex-shrink:0}
.icon-btn:hover{border-color:var(--ink)}

main{position:relative;z-index:1;max-width:1200px;margin:0 auto;padding:30px 20px 90px var(--gutter)}

/* buttons */
.btn{appearance:none;font:600 16px/1.2 var(--sans);padding:11px 18px;border-radius:10px;border:1.5px solid var(--ink);background:var(--paper-2);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:8px;text-decoration:none}
.btn:hover{background:var(--paper-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);box-shadow:0 3px 0 var(--accent-2)}
.btn.primary:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn.primary:active{transform:translateY(2px);box-shadow:0 1px 0 var(--accent-2)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.ghost:hover{color:var(--ink);background:var(--paper-3)}
.btn.small{padding:7px 12px;font-size:14.5px}
.cta{display:flex;align-items:center;gap:14px;flex-wrap:wrap}

/* headings */
.page-h{margin:6px 0 28px;max-width:66ch}
.page-h h1{font:800 clamp(34px,4.6vw,50px)/1.35 var(--serif);margin:0}
.page-h .sub{font:600 18px/1.3 var(--sans);color:var(--ink-2);margin:0 0 12px}
.page-h p{margin:0 0 8px}
.sec-h{font:800 22px/1.4 var(--serif);margin:0 0 12px}
.sec-h small{font:500 15px var(--sans);color:var(--ink-2);margin-left:8px}

/* slate */
.slate-frame{padding:clamp(7px,1.1vw,11px);border-radius:18px;background:repeating-linear-gradient(96deg,rgba(255,255,255,.05) 0 3px,rgba(0,0,0,.05) 3px 8px),linear-gradient(135deg,var(--wood-1),var(--wood-2));box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 16px 30px -20px rgba(15,20,30,.7)}
.slate{position:relative;border-radius:10px;background:radial-gradient(90% 130% at 25% 15%,var(--slate-2),var(--slate) 70%);color:var(--chalk);box-shadow:inset 0 2px 16px rgba(0,0,0,.45);overflow:hidden;padding:clamp(14px,2.2vw,26px)}
.slate::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(40% 30% at 72% 68%,rgba(255,255,255,.04),transparent 70%),radial-gradient(30% 25% at 18% 82%,rgba(255,255,255,.03),transparent 70%)}
.slate.bad{animation:nudge .18s}
@keyframes nudge{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.slate kbd{display:inline-block;font:600 14px/1 var(--sans);padding:6px 9px;border-radius:7px;border:1px solid rgba(243,241,233,.4);color:var(--chalk)}

/* carriage */
.carriage{--fs:clamp(30px,5.2vw,52px);position:relative;height:calc(var(--fs)*2.1);font:500 var(--fs)/1 var(--sans);overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 9%,#000 91%,transparent);mask-image:linear-gradient(90deg,transparent,#000 9%,#000 91%,transparent)}
.track{position:absolute;top:0;left:0;height:100%;display:flex;align-items:center;white-space:pre;transition:transform .14s cubic-bezier(.2,.7,.3,1);will-change:transform}
.cl{position:relative;display:inline-block;line-height:1.7;color:var(--chalk);text-shadow:0 0 1px rgba(255,255,255,.35),0 0 12px rgba(255,255,255,.07)}
.cl.sp{width:.42em}
.cl.end{width:1px}
.cl.done{color:var(--chalk-dim);text-shadow:none}
.cl.cur{color:var(--chalk-y)}
.cl.cur::after{content:"";position:absolute;left:4%;right:4%;bottom:.12em;height:4px;border-radius:3px;background:var(--chalk-y)}
.cl.part::after{background:repeating-linear-gradient(90deg,var(--chalk-y) 0 6px,transparent 6px 10px)}
.cl.bad{color:var(--chalk-r)}
.cl.bad::after{background:var(--chalk-r)}
.slate-foot{display:flex;justify-content:space-between;align-items:center;gap:10px 18px;flex-wrap:wrap;margin-top:6px;padding-top:12px;border-top:1px dashed rgba(243,241,233,.2);font:500 15px/1.4 var(--sans)}
.recipe{display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-height:34px}
.recipe .rg{font:600 26px/1.3 var(--sans);color:var(--chalk-y);margin-right:4px}
.recipe .req{color:var(--chalk-mid);margin-right:4px}
.recipe kbd.kd{opacity:.38}
.recipe kbd.kn{background:var(--chalk-y);color:var(--slate);border-color:var(--chalk-y)}
.stats{display:flex;gap:18px;color:var(--chalk-mid)}
.stats b{font:800 20px/1 var(--serif);color:var(--chalk);margin-right:3px}
.board-ov{position:absolute;inset:0;display:grid;place-items:center;background:rgba(18,24,22,.62);font:800 clamp(56px,10vw,110px)/1.3 var(--serif);color:var(--chalk-y);z-index:4}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:clamp(24px,4vw,56px);align-items:center;margin:4px 0 44px}
.hero h1{font:800 clamp(40px,5.8vw,68px)/1.3 var(--serif);margin:0}
.hero .sub{font:500 clamp(18px,1.9vw,20px)/1.55 var(--sans);color:var(--ink-2);margin:12px 0 24px;max-width:46ch}
.demo{min-height:300px;display:flex;flex-direction:column;justify-content:center;text-align:center}
.demo-big{font:600 clamp(84px,11vw,130px)/1.25 var(--sans);margin:0;color:var(--chalk);text-shadow:0 0 1px rgba(255,255,255,.4)}
.demo-map{margin:4px 0 14px;color:var(--chalk-mid);font-size:17px}
.demo-map kbd{margin-right:6px;color:var(--chalk-y);border-color:rgba(246,215,104,.5)}
.demo-line{margin:0;min-height:1.7em;font:500 28px/1.7 var(--sans);color:var(--chalk);border-top:1px dashed rgba(243,241,233,.2);padding-top:10px;white-space:pre-wrap;word-break:break-word}
.demo-line .ph{color:var(--chalk-dim);font-size:18px}
.caret{display:inline-block;width:3px;height:1em;background:var(--chalk-y);vertical-align:-.12em;margin-left:2px;animation:blink 1.1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.touch-note{margin-top:12px}

/* report card */
.rc-wrap{margin:0 0 48px}
.report{margin:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));max-width:800px;border:1.5px solid var(--ink);border-radius:4px;background:var(--paper-2)}
.report>div{padding:12px 16px;border-right:1px solid var(--line)}
.report>div:last-child{border-right:0}
.report dt{font:500 14.5px/1.3 var(--sans);color:var(--ink-2)}
.report dd{margin:4px 0 0;font:800 24px/1.3 var(--serif)}

/* lesson path */
.unit{margin:0 0 40px;max-width:840px}
.unit-h{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:start;column-gap:16px;margin-bottom:10px}
.unit-no{font:800 46px/1.2 var(--serif);color:var(--accent);min-width:1.1em}
.unit-h h2{font:800 25px/1.45 var(--serif);margin:0}
.unit-h h2 small{font:500 16px var(--sans);color:var(--ink-2);margin-left:10px}
.unit-h p{margin:0;color:var(--ink-2);max-width:62ch}
.unit-prog{font:600 14px/2.6 var(--sans);color:var(--ink-2);white-space:nowrap}
.lessons{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.ls{all:unset;box-sizing:border-box;width:100%;display:grid;grid-template-columns:2.6em minmax(0,1fr) auto 5.8em;align-items:center;gap:14px;padding:9px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.ls:hover{background:var(--paper-2)}
.ls:focus-visible{outline:3px solid var(--blue);outline-offset:-3px}
.ls .ln{font:700 17px/1 var(--serif);color:var(--ink-3)}
.ls .lt{font:600 17px/1.4 var(--sans)}
.ls .lk{font:500 19px/1.3 var(--sans);color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:13em}
.ls .lst{text-align:right;font-size:17px;letter-spacing:2px;color:var(--gold);white-space:nowrap}
.ls.done .ln{color:var(--good)}
.ls.cur{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.ls.cur .ln{color:var(--accent)}
.ls.cur .lst{color:var(--accent);letter-spacing:0;font:700 14.5px var(--sans)}
.ls.locked{color:var(--ink-3);cursor:default}
.ls.locked .lk{color:var(--ink-3)}
.ls.locked .lst{color:var(--ink-3);letter-spacing:0;font:500 14px var(--sans)}

/* index lists */
.index{list-style:none;margin:0 0 40px;padding:0;max-width:860px;border-top:1.5px solid var(--ink)}
.index>li{border-bottom:1px solid var(--line)}
.ix{all:unset;box-sizing:border-box;width:100%;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 18px;padding:14px 12px;cursor:pointer}
.ix:hover{background:var(--paper-2)}
.ix:focus-visible{outline:3px solid var(--blue);outline-offset:-3px}
.ix-t{font:700 19px/1.45 var(--serif)}
.ix-t [lang="ne"]{margin-right:6px}
.ix-d{grid-column:1;color:var(--ink-2);font-size:15.5px}
.ix-go{grid-column:2;grid-row:1/span 2;align-self:center;font:700 15px var(--sans);color:var(--accent)}
.ix-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 18px;padding:14px 12px;align-items:center}
.ix-row .modes{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.keychips{display:inline-flex;gap:6px;flex-wrap:wrap;vertical-align:middle}
.kc{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border:1px solid var(--line);border-radius:8px;background:var(--paper-2);font-size:14px;color:var(--ink-2)}
.kc b{font:600 19px/1.4 var(--sans);color:var(--ink)}

/* sessions */
.sess{max-width:1000px;margin:0 auto}
.sess-head{display:flex;align-items:center;gap:14px;margin:0 0 14px;flex-wrap:wrap}
.sess-title{flex:1;min-width:0}
.sess-title h1{font:800 clamp(22px,2.8vw,28px)/1.45 var(--serif);margin:0}
.sess-title p{margin:0;color:var(--ink-2);font-size:15px}
.dots{display:flex;gap:6px;list-style:none;margin:0;padding:0}
.dots li{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--ink-3)}
.dots li.d{background:var(--good);border-color:var(--good)}
.dots li.c{border-color:var(--accent);background:var(--accent-soft)}
.hud{display:flex;gap:16px;font:500 15px var(--sans);color:var(--ink-2)}
.hud b{font:800 20px var(--serif);color:var(--ink);margin-left:4px}

/* intro */
.intro-items{display:flex;flex-wrap:wrap;justify-content:center;gap:clamp(16px,3.5vw,44px);padding:6px 0}
.ni{display:flex;flex-direction:column;align-items:center;gap:8px;transition:transform .15s}
.ni .ng{font:600 clamp(58px,9vw,96px)/1.25 var(--sans);color:var(--chalk)}
.ni .nkeys{display:flex;gap:4px}
.ni .nf{font:500 13px var(--sans);color:var(--chalk-mid)}
.ni.lit{transform:translateY(-4px)}
.ni.lit .ng{color:var(--chalk-y)}
.intro-review{font:500 clamp(28px,4vw,40px)/1.7 var(--sans);text-align:center;margin:10px 0}
.intro-foot{display:flex;justify-content:space-between;align-items:center;gap:18px;flex-wrap:wrap;margin:16px 0 6px}
.tip{margin:0;max-width:60ch}

/* keyboard */
.kb-host{margin-top:18px}
.nokb .kb-host:not(.always){display:none}
.kb{--kh:clamp(34px,4.3vw,54px);max-width:960px;margin:0 auto;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.kb.big{--kh:clamp(38px,5vw,62px)}
.kb.small{--kh:clamp(26px,3vw,36px);max-width:620px}
.kb-row{display:grid;grid-template-columns:repeat(60,minmax(0,1fr))}
.k{padding:2.5px;min-width:0}
.k.gap{visibility:hidden}
.cap{position:relative;height:var(--kh);border-radius:8px;background:var(--key);border:1px solid var(--key-edge);box-shadow:0 2px 0 var(--key-edge);color:var(--key-text);display:flex;align-items:center;justify-content:center;transition:background .12s,transform .06s,box-shadow .06s;cursor:pointer;overflow:hidden}
.cap .n{font:600 calc(var(--kh)*.4)/1 var(--sans);padding-top:.2em}
.cap .s{position:absolute;top:2px;left:5px;font:500 calc(var(--kh)*.25)/1.3 var(--sans);color:var(--key-sub)}
.cap .l{position:absolute;bottom:3px;right:5px;font:600 calc(var(--kh)*.2)/1 var(--sans);color:var(--key-sub)}
.k.sp .cap .l{position:static;font-size:13px}
.k[data-f$="p"]{--fc:var(--f-p)} .k[data-f$="r"]{--fc:var(--f-r)} .k[data-f$="m"]{--fc:var(--f-m)} .k[data-f$="i"]{--fc:var(--f-i)} .k[data-f="th"]{--fc:var(--f-t)}
:where(body:not(.nofingers)) .k[data-f] .cap,:where(.kb.force-f) .k[data-f] .cap{background:color-mix(in srgb,var(--fc) 15%,var(--key))}
.k[data-k="f"] .cap::after,.k[data-k="j"] .cap::after{content:"";position:absolute;bottom:5px;left:50%;width:12px;margin-left:-6px;height:2px;border-radius:2px;background:var(--key-sub)}
.kb .k.heat .cap{background:color-mix(in srgb,var(--accent) var(--hp),var(--key))}
.kb .k.newk .cap{outline:2.5px dashed var(--accent);outline-offset:1px}
.kb .k.next .cap{background:var(--accent);border-color:var(--accent-2);box-shadow:0 2px 0 var(--accent-2),0 0 0 4px var(--accent-soft);color:#fff}
.kb .k.next .cap .s,.kb .k.next .cap .l{color:rgba(255,255,255,.82)}
.kb .k.down .cap{transform:translateY(2px);box-shadow:0 0 0 var(--key-edge)}
.kb .k.errk .cap{background:var(--chalk-r);color:#3a0b0b}
.kb .k.latched .cap{background:var(--ink);color:var(--paper)}
.kb.blind .k:not(.reveal) .cap .n,.kb.blind .k:not(.reveal) .cap .s{visibility:hidden}
.legend{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin:10px 0 0;font-size:14px;color:var(--ink-2)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:6px;vertical-align:-1px}

/* hands */
.hands{display:flex;flex-direction:column;align-items:center;margin-top:8px}
.nohands .hands{display:none}
.hands svg{width:min(290px,68vw);height:auto;display:block}
.hands rect{fill:var(--paper-3);stroke:var(--line);stroke-width:1.2;transition:fill .12s}
.hands rect.palm{fill:var(--paper-3);stroke:none}
.hands rect.on{stroke:var(--ink);stroke-width:1.6}
.hands rect.on2{opacity:.6}
.hand-label{margin:4px 0 0;font:500 14.5px/1.4 var(--sans);color:var(--ink-2);min-height:1.4em;text-align:center}
.hand-label [lang="ne"]{color:var(--ink-3);margin-left:6px}

/* results */
.result{max-width:860px;margin:0 auto}
.r-slate{text-align:center;padding-top:clamp(20px,3vw,34px);padding-bottom:clamp(20px,3vw,34px)}
.r-kicker{margin:0;font:600 17px var(--sans);color:var(--chalk-mid)}
.r-big{margin:2px 0 0;font:800 clamp(40px,6vw,64px)/1.35 var(--serif);color:var(--chalk)}
.r-stars{margin:0;font-size:40px;letter-spacing:8px;color:var(--chalk-y)}
.r-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));max-width:640px;margin:14px auto 4px}
.r-grid b{display:block;font:800 clamp(26px,4vw,38px)/1.25 var(--serif);color:var(--chalk)}
.r-grid span{font:500 14.5px var(--sans);color:var(--chalk-mid)}
.r-note{color:var(--chalk-mid);max-width:50ch;margin:12px auto 0}
.r-miss{margin:18px 0 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.r-btns{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:22px}

/* practice & test */
.own{max-width:860px;margin-top:8px}
.own textarea,.pad{width:100%;border:1.5px solid var(--ink);border-radius:12px;background:var(--paper-2);color:var(--ink);font:500 22px/1.6 var(--sans);padding:14px 16px;resize:vertical}
.own .cta{margin-top:12px}
.heat-wrap{max-width:860px;margin:0 0 40px}
.setup{display:grid;gap:18px;max-width:760px;margin:0 0 40px}
fieldset{border:0;margin:0;padding:0}
legend{font:700 16px var(--sans);margin-bottom:8px;padding:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip span{display:inline-block;padding:8px 16px;border:1.5px solid var(--line);border-radius:999px;font:600 15.5px var(--sans);cursor:pointer;background:var(--paper-2)}
.chip input:checked+span{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip input:focus-visible+span{outline:3px solid var(--blue);outline-offset:2px}
.tbl{border-collapse:collapse;width:100%;max-width:680px;font-size:15.5px}
.tbl th,.tbl td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl th{font-weight:600;color:var(--ink-2)}
.tbl td.n{font-variant-numeric:tabular-nums}
.tbl tr.pb td{font-weight:700}
.spark{width:100%;max-width:680px;height:70px;display:block;margin:6px 0 16px;border-bottom:1px solid var(--line)}
.ref-tbl td:first-child{font:600 24px/1.4 var(--sans);width:4em}
.notes{max-width:70ch;padding-left:20px}
.notes li{margin:6px 0}
.pad-bar{display:flex;align-items:center;gap:10px;margin:10px 0 0;flex-wrap:wrap}
.pad-bar .spacer{flex:1}

/* quiz */
.q-slate{text-align:center;min-height:230px;display:flex;flex-direction:column;justify-content:center}
.q-prompt{margin:0;font:600 19px/1.4 var(--sans);color:var(--chalk-mid)}
.q-glyph{margin:0;font:600 clamp(70px,12vw,120px)/1.35 var(--sans);color:var(--chalk)}
.q-keys{margin:18px 0 8px;display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.q-keys kbd{font-size:22px;padding:10px 14px;color:var(--chalk-y);border-color:rgba(246,215,104,.55)}
.q-body{margin-top:18px}
.q-opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.q-opt{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:14px;padding:12px 16px;border:1.5px solid var(--line);border-radius:12px;background:var(--paper-2);cursor:pointer;font:600 20px/1.4 var(--sans);min-height:60px}
.q-opt:hover{border-color:var(--ink)}
.q-opt:focus-visible{outline:3px solid var(--blue)}
.q-opt .qn{font:700 13px/1 var(--sans);color:var(--ink-3);border:1px solid var(--line);border-radius:6px;padding:5px 7px}
.q-opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 13%,var(--paper-2))}
.q-opt.wrong{border-color:var(--accent);background:var(--accent-soft)}
.q-fb{min-height:1.6em;font-weight:600;margin:14px 0 8px}
.q-fb.ok{color:var(--good)} .q-fb.no{color:var(--accent)}
.q-type{color:var(--ink-2);margin:0}

/* games */
.arena{height:clamp(340px,56vh,540px);padding:0}
.drop{position:absolute;top:0;left:50%;transform:translate(-50%,-60px);padding:0 6px 6px;white-space:nowrap;will-change:transform}
.drop .dt{display:block;font:600 clamp(28px,3.6vw,40px)/1.35 var(--sans);color:var(--chalk);text-shadow:0 0 1px rgba(255,255,255,.35)}
.drop .bar{position:absolute;left:6px;right:6px;bottom:0;height:3px;border-radius:2px;background:rgba(243,241,233,.14);overflow:hidden}
.drop .bar i{display:block;height:100%;width:0;background:var(--chalk-y)}
.drop.lock .dt{color:var(--chalk-y)}
.drop.hit .dt{animation:pop .3s forwards}
.drop.miss .dt{color:var(--chalk-r);animation:fadeout .5s forwards}
.drop .dt.shake{animation:nudge .18s}
@keyframes pop{to{opacity:0;transform:scale(1.5)}}
@keyframes fadeout{to{opacity:0;transform:translateY(8px)}}
.ledge{position:absolute;left:0;right:0;bottom:0;height:12px;background:linear-gradient(var(--wood-1),var(--wood-2));box-shadow:0 -2px 6px rgba(0,0,0,.3)}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:20px;background:rgba(18,24,22,.72);z-index:5}
.overlay p{margin:0;max-width:44ch;color:var(--chalk-mid)}
.overlay .ov-big{font:800 clamp(40px,6vw,60px)/1.35 var(--serif);color:var(--chalk)}
.overlay .btn{margin-top:8px}
.lanes{border:1.5px solid var(--ink);border-radius:12px;background:var(--paper-2);padding:4px 14px;margin:0 0 16px}
.lane{display:grid;grid-template-columns:7.5em minmax(0,1fr) 1.6em;align-items:center;gap:10px;height:50px;border-bottom:1px dashed var(--line)}
.lane:last-child{border-bottom:0}
.lane .who{font:600 14.5px/1.2 var(--sans)}
.lane .who small{display:block;font-weight:500;color:var(--ink-2)}
.road{position:relative;height:100%}
.road::before{content:"";position:absolute;left:0;right:0;top:50%;border-top:2px dashed var(--line)}
.veh{position:absolute;top:50%;left:0;font-size:30px;line-height:1;transform:translateY(-55%) scaleX(-1)}
.lane.you .who{color:var(--accent)}
.hunt{min-height:320px;display:flex;flex-direction:column}
.timebar{height:4px;background:rgba(243,241,233,.14);border-radius:2px;overflow:hidden}
.timebar i{display:block;height:100%;width:100%;background:var(--chalk-y)}
.hunt-glyph{flex:1;display:grid;place-items:center;margin:0;font:600 clamp(96px,18vw,180px)/1.3 var(--sans);color:var(--chalk)}
.hunt-sub{margin:0;text-align:center;color:var(--chalk-mid);min-height:1.5em}

/* toast & dialog */
#toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);opacity:0;background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font:600 15px var(--sans);transition:opacity .2s,transform .2s;pointer-events:none;z-index:60;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
dialog{border:1.5px solid var(--ink);border-radius:14px;background:var(--paper-2);color:var(--ink);padding:22px 24px;width:min(440px,92vw)}
dialog::backdrop{background:rgba(10,14,24,.45)}
dialog h2{font:800 24px/1.4 var(--serif);margin:0 0 6px}
.set-row{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer}
.set-row input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent)}
.set-row select{font:500 15px var(--sans);padding:6px 8px;border-radius:8px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink)}
.set-foot{display:flex;justify-content:space-between;align-items:center;margin-top:16px;gap:10px}

@media (max-width:860px){.hero{grid-template-columns:1fr}.demo{min-height:240px}}
@media (max-width:640px){
  body::before{display:none}
  :root{--gutter:14px}
  main{padding:18px 14px 70px}
  .top-in{flex-wrap:wrap;gap:6px 10px;padding:8px 12px}
  .tabs{order:3;flex-basis:100%}
  .brand{flex:1}
  .tab{padding:4px 9px 8px}
  .tab .ne{font-size:15px}
  .tab .en{font-size:11.5px}
  .ls{grid-template-columns:2em minmax(0,1fr) auto;gap:10px}
  .ls .lk{display:none}
  .report{grid-template-columns:repeat(2,minmax(0,1fr))}
  .report>div:nth-child(2){border-right:0}
  .report>div:nth-child(-n+2){border-bottom:1px solid var(--line)}
  .r-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .q-opts{grid-template-columns:1fr}
  .stats{gap:12px}
  .kb .cap .l{display:none}
  .kb .cap .s{left:3px;top:1px}
  .unit-no{font-size:36px}
  .unit-h{grid-template-columns:auto minmax(0,1fr)}
  .unit-prog{display:none}
  .ix-row{grid-template-columns:1fr}
  .ix-row .modes{justify-content:flex-start}
  .lane{grid-template-columns:5.6em minmax(0,1fr) 1.4em}
  .hands{display:none}
}
@media (prefers-reduced-motion:reduce){
  .track{transition:none}
  .caret{animation:none}
  .slate.bad,.drop .dt.shake{animation:none}
  .ni{transition:none}
}

<script>
'use strict';
// ===== ENGINE START =====
// Nepali Traditional (Preeti-compatible) layout. Keys are US-QWERTY characters; outputs are Unicode.
const KEYMAP = {
  '`':'ञ','~':'ञ्','1':'ज्ञ','!':'१','2':'द्द','@':'२','3':'घ','#':'३','4':'द्ध','$':'४','5':'छ','%':'५','6':'ट','^':'६','7':'ठ','&':'७','8':'ड','*':'८','9':'ढ','(':'९','0':'ण्',')':'०','-':'(','_':')','=':'.','+':'ं',
  'q':'त्र','Q':'त्त','w':'ध','W':'ध्','e':'भ','E':'ऐ','r':'च','R':'द्व','t':'त','T':'ट्ट','y':'थ','Y':'ठ्ठ','u':'ग','U':'ऊ','i':'ष','I':'क्ष्','o':'य','O':'इ','p':'उ','P':'ए','[':'ृ','{':'र्',']':'े','}':'ै','\\':'्','|':'्र',
  'a':'ब','A':'ब्','s':'क','S':'क्','d':'म','D':'म्','f':'ा','F':'ँ','g':'न','G':'न्','h':'ज','H':'ज्','j':'व','J':'व्','k':'प','K':'प्','l':'ि','L':'ी',';':'स',':':'स्',"'":'ु','"':'ू',
  'z':'श','Z':'श्','x':'ह','X':'ह्','c':'अ','C':'ऋ','v':'ख','V':'ख्','b':'द','B':'द्य','n':'ल','N':'ल्','m':'ः','M':'\u0921\u093C',',':',','<':'?','.':'।','>':'श्र','/':'र','?':'रु',' ':' '
};
// Multi-key sequences, exactly as Preeti typists type them.
const COMBOS = {'cf':'आ','cf]':'ओ','cf}':'औ','O{':'ई','f]':'ो','f}':'ौ','km':'फ','em':'झ','0f':'ण','If':'क्ष'};
// Free-typing composition rules (used by the writing pad and the demo slate).
const RULES = [['क्ष्ा','क्ष'],['ण्ा','ण'],['अा','आ'],['आे','ओ'],['आै','औ'],['ाे','ो'],['ाै','ौ'],['इर्','ई'],['पः','फ'],['भः','झ']];
const INF = 1e9;
const CHUNKS = [];
for (const k in KEYMAP) CHUNKS.push({keys:k, out:KEYMAP[k], w:(k==='|'||k==='{')?8:10, combo:false});
for (const k in COMBOS) CHUNKS.push({keys:k, out:COMBOS[k], w:k.length*10-1, combo:true});
const BY_FIRST = {};
for (const c of CHUNKS) (BY_FIRST[c.out[0]] || (BY_FIRST[c.out[0]] = [])).push(c);

function applyRules(str){ for (const [a,b] of RULES) if (str.endsWith(a)) return str.slice(0,-a.length)+b; return str; }
function chunkOk(c, allow){ return !allow || (c.combo ? allow.combos.has(c.keys) : allow.keys.has(c.keys)); }
function bestTable(t, allow){
  const n=t.length, cost=new Array(n+1).fill(INF), ch=new Array(n+1).fill(null); cost[n]=0;
  for (let p=n-1; p>=0; p--){
    const list=BY_FIRST[t[p]]; if(!list) continue;
    for (const c of list){
      if (!chunkOk(c,allow) || !t.startsWith(c.out,p)) continue;
      const q=p+c.out.length; if (cost[q]>=INF) continue;
      const v=c.w+cost[q]; if (v<cost[p]){ cost[p]=v; ch[p]=c; }
    }
  }
  return {cost, ch};
}
function canType(t, allow){ return t.length>0 && bestTable(t,allow).cost[0] < INF; }
function keyPath(t, allow){ const b=bestTable(t,allow); if (b.cost[0]>=INF) return null; const out=[]; for (let p=0; p<t.length;){ const c=b.ch[p]; out.push(c); p+=c.out.length; } return out; }
function keyCount(t){ const p=keyPath(t,null); return p ? p.reduce((s,c)=>s+c.keys.length,0) : t.length; }
const now = () => (typeof performance!=='undefined' ? performance.now() : Date.now());

// Matches keystrokes against a target text. Accepts any valid key path; hints follow the taught path.
class Typer {
  constructor(text, allow){
    this.t=text; this.n=text.length; this.p=0; this.pending='';
    this.Ba=bestTable(text,null); this.Br=allow ? bestTable(text,allow) : this.Ba;
    this.correct=0; this.errors=0; this.start=0; this.end=0; this.hits={}; this.misses={}; this.log=[];
  }
  get done(){ return this.p>=this.n; }
  cands(p){ const list=BY_FIRST[this.t[p]]||[]; const r=[]; for (const c of list){ if (this.t.startsWith(c.out,p) && this.Ba.cost[p+c.out.length]<INF) r.push(c); } return r; }
  canStart(k){ return this.p===0 && !this.pending && this.cands(0).some(c=>c.keys[0]===k); }
  step(p){ return this.Br.cost[p]<INF ? this.Br.ch[p] : this.Ba.ch[p]; }
  costAt(p){ return this.Br.cost[p]<INF ? this.Br.cost[p] : this.Ba.cost[p]; }
  pendingOption(){
    const pd=this.pending; let best=null, bc=INF;
    for (const c of this.cands(this.p)){
      if (!c.keys.startsWith(pd)) continue;
      const q=this.p+c.out.length;
      if (c.keys.length>pd.length){ const v=(c.keys.length-pd.length)*10+this.costAt(q); if (v<bc){ bc=v; best={rest:c.keys.slice(pd.length), q}; } }
      else if (c.keys===pd){ const v=this.costAt(q)-1; if (v<bc){ bc=v; best={rest:'', q}; } }
    }
    return best;
  }
  nextKey(){
    if (this.done) return null;
    let p=this.p;
    if (this.pending){ const o=this.pendingOption(); if(!o) return null; if (o.rest) return o.rest[0]; p=o.q; if (p>=this.n) return null; }
    const c=this.step(p); return c ? c.keys[0] : null;
  }
  plan(limit){
    const keys=[]; let p=this.p;
    if (this.pending){ const o=this.pendingOption(); if(!o) return keys; for (const k of o.rest) keys.push(k); p=o.q; }
    const lim=Math.min(limit,this.n);
    while (p<lim){ const c=this.step(p); if(!c) break; for (const k of c.keys) keys.push(k); p+=c.out.length; }
    return keys;
  }
  feed(k){
    if (this.done) return 'done';
    const t=now(); if (!this.start) this.start=t;
    const exp=this.nextKey(); const p0=this.p;
    if (this._try(k)){
      this.correct++; this.hits[k]=(this.hits[k]||0)+1; this.log.push({k,p0});
      if (this.done){ this.end=t; return 'done'; }
      return 'ok';
    }
    this.errors++; if (exp) this.misses[exp]=(this.misses[exp]||0)+1;
    return 'err';
  }
  _try(k){
    const np=this.pending+k;
    const cs=this.cands(this.p).filter(c=>c.keys.startsWith(np));
    if (cs.length){
      const ex=cs.find(c=>c.keys===np), longer=cs.some(c=>c.keys.length>np.length);
      if (ex && (!longer || this.p+ex.out.length>=this.n)){ this.p+=ex.out.length; this.pending=''; }
      else this.pending=np;
      return true;
    }
    if (this.pending){
      const ex=this.cands(this.p).find(c=>c.keys===this.pending);
      if (ex){
        const sp=this.p, spd=this.pending;
        this.p+=ex.out.length; this.pending='';
        if (this.p<this.n && this._try(k)) return true;
        this.p=sp; this.pending=spd;
      }
    }
    return false;
  }
  elapsed(){ return this.start ? ((this.end||now())-this.start) : 0; }
  wpm(){ const m=this.elapsed()/60000; return m>0.025 ? this.correct/5/m : 0; }
  acc(){ const s=this.correct+this.errors; return s ? this.correct/s*100 : 100; }
  wordsDone(){ let w=0; for (let i=0;i<this.p;i++) if (this.t[i]===' ') w++; if (this.done && this.n) w++; return w; }
}

// Split text into display clusters (a consonant stack plus its signs) so Devanagari shaping stays intact.
function clusters(t){
  const out=[]; const n=t.length; let i=0;
  const isC=ch=>(ch>='\u0915'&&ch<='\u0939')||(ch>='\u0958'&&ch<='\u095F');
  const isV=ch=>(ch>='\u0904'&&ch<='\u0914')||ch==='\u0960'||ch==='\u0961';
  const isM=ch=>(ch>='\u093A'&&ch<='\u094C')||(ch>='\u0900'&&ch<='\u0903')||ch==='\u094E'||ch==='\u094F'||(ch>='\u0951'&&ch<='\u0957')||ch==='\u0962'||ch==='\u0963';
  while (i<n){
    const s=i, ch=t[i];
    if (isC(ch)){
      i++;
      while (i<n){
        if (t[i]==='\u093C'){ i++; continue; }
        if (t[i]==='\u094D'){ i++; if (i<n && isC(t[i])){ i++; continue; } break; }
        break;
      }
      while (i<n && isM(t[i])) i++;
    } else if (isV(ch)){ i++; while (i<n && isM(t[i])) i++; }
    else if (isM(ch)||ch==='\u094D'){ i++; while (i<n && (isM(t[i])||t[i]==='\u094D')) i++; }
    else i++;
    out.push({s, e:i, t:t.slice(s,i)});
  }
  return out;
}

const shuffle=a=>{ a=a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const chunk=(a,n)=>{ const r=[]; for (let i=0;i<a.length;i+=n) r.push(a.slice(i,i+n)); return r; };
function pickN(arr,n){ if(!arr.length||n<=0) return []; const out=[]; let bag=[], guard=0; while(out.length<n && guard++<n*20){ if(!bag.length) bag=shuffle(arr); const w=bag.pop(); if(arr.length>1 && out[out.length-1]===w) continue; out.push(w); } return out; }

    update, reposition(){ if(last>=0) position(last); },

// ---------- typing sessions (lessons, practice, tests) ----------
function openSession(cfg){
  stopAll(); view='session'; if(cfg.tab) setTab(cfg.tab);
  sess={...cfg, idx:0, agg:{correct:0,errors:0,ms:0,misses:{},words:0}, typer:null, finished:false, pause:false};
  main.innerHTML=`<div class="sess"><div class="sess-head"><button class="btn ghost small" data-act="exitSess">Exit</button><div class="sess-title"><h1>${esc(cfg.title)}</h1><p>${esc(cfg.sub||'')}</p></div><ol class="dots" id="dots" aria-hidden="true"></ol></div><div id="boardHost"></div><div id="kbHost"></div></div>`;
  board=TypeBoard(); $('#boardHost').appendChild(board.el); mountKb($('#kbHost'));
  consumer={key:sessKey, esc:()=>sess&&sess.back()};
  loadExercise(); tickTimer=setInterval(sessTick,200);
  if(document.activeElement&&document.activeElement!==document.body) document.activeElement.blur();
}
function loadExercise(){ sess.typer=new Typer(sess.texts[sess.idx],sess.allow); board.setTyper(sess.typer); const d=$('#dots'); if(d) d.innerHTML=sess.texts.length>1?sess.texts.map((_,i)=>`<li class="${i<sess.idx?'d':i===sess.idx?'c':''}"></li>`).join(''):''; updateHint(sess.typer.nextKey()); sessTick(); }
function sessKey(k){
  if(!sess||sess.finished||sess.pause) return; const ty=sess.typer;
  if(k==='Backspace'){ if(ty.pending){ ty.pending=''; board.update(); updateHint(ty.nextKey()); } return; }
  const exp=ty.nextKey(); const r=ty.feed(k); kb&&kb.press(k);
  if(r==='err'){ sErr(); board.bad(); kb&&kb.flash(exp); } else sClick();
  board.update(); updateHint(ty.nextKey()); sessTick();
  if(r==='done') exerciseDone();
}
function accumulate(ty){ if(ty._counted) return; ty._counted=true; const a=sess.agg; a.correct+=ty.correct; a.errors+=ty.errors; a.ms+=ty.elapsed(); a.words+=ty.wordsDone(); for(const [k,v] of Object.entries(ty.misses)) a.misses[k]=(a.misses[k]||0)+v; recordKeys(ty.hits,ty.misses); }
function exerciseDone(){ accumulate(sess.typer); if(sess.idx<sess.texts.length-1){ sess.pause=true; sDing(); const s=sess; setTimeout(()=>{ if(sess!==s) return; s.pause=false; s.idx++; loadExercise(); },450); } else finishSession(); }
function sessTick(){
  if(!sess||!board) return; const ty=sess.typer, a=sess.agg;
  const cur=ty&&!ty._counted; const ms=a.ms+(cur?ty.elapsed():0), cor=a.correct+(cur?ty.correct:0), err=a.errors+(cur?ty.errors:0);
  const w=ms>1500?cor/5/(ms/60000):0, acc=cor+err?cor/(cor+err)*100:100;
  let t=fmtTime(ms);
  if(sess.limitMs){ const left=sess.limitMs-ms; t=fmtTime(left); if(ty.start&&left<=0){ board.setStats(Math.round(w),Math.round(acc),'0:00'); finishSession(); return; } }
  board.setStats(Math.round(w),Math.round(acc),t);
}
function finishSession(){
  if(!sess||sess.finished) return; sess.finished=true; clearInterval(tickTimer); tickTimer=null;
  const ty=sess.typer; if(ty&&!ty._counted&&ty.correct>0){ if(sess.limitMs&&ty.start&&!ty.end) ty.end=ty.start+Math.max(0,sess.limitMs-sess.agg.ms); accumulate(ty); }
  const a=sess.agg; const res={wpm:a.ms>0?a.correct/5/(a.ms/60000):0, acc:a.correct+a.errors?a.correct/(a.correct+a.errors)*100:100, ms:a.ms, errors:a.errors, correct:a.correct, words:a.words, misses:a.misses};
  if(a.correct>0){ S.recent.push({wpm:res.wpm,acc:res.acc}); if(S.recent.length>20) S.recent.shift(); } save(); sDing();
  const f=sess.finish; consumer=null; board=null; kb=null; hands=null; sess=null; f(res);
}
const noteFor=r=>r.acc>=97?'Clean typing. Next time, keep this accuracy and let the speed creep up.':r.acc>=90?'Good work. Slow down slightly and aim for fewer mistakes; speed follows accuracy.':'Take it slower. Watch the slate, not your hands, and let accuracy come first.';
function missHTML(m){ const top=Object.entries(m||{}).sort((a,b)=>b[1]-a[1]).slice(0,6); if(!top.length) return ''; return `<div class="r-miss"><span class="muted">Keys you missed most</span>${top.map(([k,n])=>`<span class="kc"><b lang="ne">${esc(glyph(KEYMAP[k]||k))}</b>${esc(labelFor(k))}, ${n}×</span>`).join('')}</div>`; }

const TOPICS={all:{ne:'सबै',en:'All keys',desc:'Questions from the whole layout.'},home:{ne:'घर पङ्क्ति',en:'Home row',keys:"asdfghjkl;'",desc:'ब क म ा न ज व प ि स ु'},top:{ne:'माथिल्लो पङ्क्ति',en:'Top row',keys:'qwertyuiop[]',desc:'त्र ध भ च त थ ग ष य उ ृ े'},bottom:{ne:'तल्लो पङ्क्ति',en:'Bottom row',keys:'zxcvbnm,./',desc:'श ह अ ख द ल ः । र'},number:{ne:'अङ्क पङ्क्ति',en:'Number row',keys:'`1234567890',desc:'ञ ज्ञ द्द घ द्ध छ ट ठ ड ढ ण्'},shift:{ne:'सिफ्ट',en:'Shift keys',keys:'QWERTYUIOP{}|ASDFGHJKL:"ZXCVB>?+',desc:'Long vowel signs, vowels and half letters.'},combos:{ne:'जोडी',en:'Key sequences',combos:true,desc:'आ ओ औ ई ो ौ फ झ ण क्ष'}};
const comboItems=()=>Object.entries(COMBOS).map(([k,o])=>({keys:k,o,combo:true}));
function quizItems(t){ const T=TOPICS[t]; const add=ks=>[...ks].map(k=>({keys:k,o:KEYMAP[k],combo:false}));
  let it = t==='all' ? add(TOPICS.home.keys+TOPICS.top.keys+TOPICS.bottom.keys+TOPICS.number.keys+TOPICS.shift.keys).concat(comboItems()) : T.combos ? comboItems() : add(T.keys);
  return it.filter(x=>x.o!==','); }
function distract(correct,pool,n){ const out=[correct]; for(const x of shuffle(pool)){ if(out.length>=n+1) break; if(!out.includes(x)) out.push(x); } return shuffle(out); }
const SHORT_WORDS=WORDS.filter(w=>{ const p=keyPath(w,null); return p && p.reduce((s,c)=>s+c.keys.length,0)<=6 && w.length<=5; });
function makeQ(type,it,items){
  const singles=items.filter(x=>!x.combo);
  if(type==='what'&&it.combo) type='combo'; if(type==='finger'&&it.combo) type='which';
  if(type==='combo'&&!it.combo) type='which';
  if(type==='press') return {type,o:it.o,keys:it.keys};
  if(type==='what'){ const opts=distract(glyph(it.o),singles.concat(quizItems('all').filter(x=>!x.combo)).map(x=>glyph(x.o)),3); return {type,keys:it.keys,o:it.o,options:opts,ans:opts.indexOf(glyph(it.o)),explain:`${labelFor(it.keys)} types ${glyph(it.o)}.`}; }
  if(type==='which'){ const lab=seqLabel(it.keys); const opts=distract(lab,items.concat(quizItems('all')).map(x=>seqLabel(x.keys)),3); return {type,o:it.o,keys:it.keys,options:opts,ans:opts.indexOf(lab),explain:`${glyph(it.o)} is ${lab}.`}; }
  if(type==='finger'){ const f=fingerOf(it.keys); const lab=FNAME[f][0]; const opts=distract(lab,Object.values(FNAME).map(x=>x[0]).filter(x=>x!=='Thumb'),3); return {type,o:it.o,keys:it.keys,options:opts,ans:opts.indexOf(lab),explain:`${glyph(it.o)} is on ${labelFor(it.keys)}, pressed with the ${lab.toLowerCase()}.`}; }
  if(type==='combo'){ const lab=seqLabel(it.keys); const fakes=comboItems().map(x=>seqLabel(x.keys)).concat([seqLabel(it.keys.split('').reverse().join(''))]); const opts=distract(lab,fakes,3); return {type,o:it.o,keys:it.keys,options:opts,ans:opts.indexOf(lab),explain:`${it.o} is ${lab}.`}; }
  const w=rnd(SHORT_WORDS); const keys=keyPath(w,null).map(c=>c.keys).join(''); const opts=distract(w,SHORT_WORDS.filter(x=>x.length===w.length||Math.abs(x.length-w.length)<=1),3);
  return {type:'word',word:w,keys,options:opts,ans:opts.indexOf(w),explain:`${seqLabel(keys)} types ${w}.`};
}
function genQuiz(t){ const items=quizItems(t); const plan=t==='combos'?['press','combo','press','combo','word','press','combo','press','combo','word']:['press','what','which','press','finger','what','word','press','which','combo']; let prev=null; return plan.map(type=>{ let it; do{ it=rnd(items); }while(items.length>1&&it===prev); prev=it; return makeQ(type,it,items); }); }
function renderQuiz(){
  main.innerHTML=`<div class="page-h"><h1 lang="ne">प्रश्नोत्तरी</h1><p class="sub">Quiz</p><p>Ten quick questions on where things live. Some ask you to type the answer on your keyboard with the key labels hidden.</p></div>
  <ol class="index">${Object.entries(TOPICS).map(([k,t])=>`<li><button class="ix" data-act="quizStart" data-t="${k}"><span class="ix-t"><span lang="ne">${t.ne}</span>${t.en}</span><span class="ix-d"><span lang="ne">${esc(t.desc)}</span>${S.quiz[k]!=null?` Best: ${S.quiz[k]} of 10.`:''}</span><span class="ix-go">Start</span></button></li>`).join('')}</ol>`;

function quizStart(t){ stopAll(); view='quiz'; setTab('quiz'); Q={t,qs:genQuiz(t),i:0,score:0,answered:false}; renderQ(); }
function renderQ(){

  <div class="q-body">${q.options?`<div class="q-opts">${q.options.map((o,i)=>`<button class="q-opt" data-act="qAns" data-i="${i}"><span class="qn">${i+1}</span><span lang="ne">${esc(o)}</span></button>`).join('')}</div>`:'<p class="q-type">Keys are unlabelled for this one. Type it from memory.</p>'}
  <p class="q-fb" id="qFb" role="status"></p><div class="cta" id="qNext" hidden><button class="btn primary" data-act="qNext">${Q.i+1<Q.qs.length?'Next question':'See your score'}</button><span class="muted">or press Enter</span></div></div><div id="kbHost"></div></div>`;
  if(q.type==='press'){ mountKb($('#kbHost'),{blind:true,hands:false}); q.ty=new Typer(q.o,null); }
  consumer={esc:()=>go('quiz'), enter:()=>{ if(Q&&Q.answered) quizNext(); }, key:k=>{ if(!Q||Q.answered) return; if(q.type==='press') quizPress(k); else if(/^[1-4]$/.test(k)) quizAnswer(+k-1); }};
}
function quizMark(ok,text){ const q=Q.qs[Q.i]; Q.answered=true; q.ok=ok; if(ok) Q.score++; const fb=$('#qFb'); fb.className='q-fb '+(ok?'ok':'no'); fb.textContent=(ok?'Right. ':'Not quite. ')+text; $('#qNext').hidden=false; ok?sPop():sErr(); }
function quizAnswer(i){ if(!Q||Q.answered) return; const q=Q.qs[Q.i]; if(!q.options||i>=q.options.length) return; $$('.q-opt').forEach((b,j)=>{ if(j===q.ans) b.classList.add('right'); else if(j===i) b.classList.add('wrong'); }); quizMark(i===q.ans,q.explain); }
function quizPress(k){ const q=Q.qs[Q.i]; kb.press(k); const exp=q.ty.nextKey(); const r=q.ty.feed(k); recordKeys(r==='err'?{}:{[k]:1}, r==='err'&&exp?{[exp]:1}:{});
  if(r==='err'){ [...q.keys].forEach((c,i)=>setTimeout(()=>kb&&kb.reveal(c),i*350)); quizMark(false,`${glyph(q.o)} is ${seqLabel(q.keys)}.`); }

function quizNext(){ Q.i++; if(Q.i<Q.qs.length){ renderQ(); return; } const t=Q.t, sc=Q.score; S.quiz[t]=Math.max(S.quiz[t]||0,sc); markDay(); save();
  main.innerHTML=`<div class="result"><div class="slate-frame"><div class="slate r-slate" lang="ne"><p class="r-kicker">${esc(TOPICS[t].en)} quiz</p><p class="r-big">${neNum(sc)} / १०</p><p class="r-note">${sc>=9?'Excellent. You know these keys.':sc>=6?'Solid. A round of practice on the keys you missed will lock them in.':'Worth another look. Try the lesson for this row, then come back.'}</p></div></div>

function rainGo(){ G.items.forEach(i=>i.el.remove()); Object.assign(G,{items:[],score:0,level:1,lives:3,caught:0,lock:null,spawn:0,running:true,last:now()}); $('#gO').hidden=true; rainHud(); updateHint(null); requestAnimationFrame(rainLoop); }
function rainSpawn(){
  const text=rainText(G.mode); const el=document.createElement('div'); el.className='drop'; el.innerHTML=`<span class="dt">${esc(text)}</span><span class="bar"><i></i></span>`;
  let x=50; for(let t=0;t<10;t++){ x=10+Math.random()*80; if(G.items.every(i=>Math.abs(i.x-x)>14||i.y>110)) break; }

function rainRemove(it){ G.items=G.items.filter(i=>i!==it); if(G.lock===it) G.lock=null; }

function rainLoop(ts){
  if(!G||!G.running) return; const dt=Math.min(.05,Math.max(0,(ts-G.last)/1000)); G.last=ts;
  G.spawn-=dt; if(G.spawn<=0){ rainSpawn(); G.spawn=Math.max(.75,(G.mode==='words'?3.2:2.2)-G.level*.13); rainHint(); }

  consumer={enter:()=>{ if(H&&!H.running) huntGo(); }, esc:()=>go('games'), key:huntKey};
}
function huntGo(){ Object.assign(H,{running:true,score:0,miss:0,t0:now(),hits:{},misses:{}}); $('#hO').hidden=true; $('#hS').textContent=0; huntNext(); clearInterval(H.timer); H.timer=setInterval(huntTick,100); }
function huntNext(){ let it; do{ it=rnd(HUNT_POOL); }while(H.item&&it.o===H.item.o); H.item=it; H.ty=new Typer(it.o,null); $('#hG').textContent=glyph(it.o); $('#hSub').textContent=it.keys.length>1?`${it.keys.length} keys in a row`:''; }
function huntKey(k){ if(!H||!H.running) return; if(k==='Backspace'){ H.ty.pending=''; return; } kb.press(k); const exp=H.ty.nextKey(); const r=H.ty.feed(k);
  if(r==='err'){ H.miss++; H.misses[exp]=(H.misses[exp]||0)+1; sErr(); kb.reveal(exp); return; }
  H.hits[k]=(H.hits[k]||0)+1;
  if(r==='done'){ H.score++; $('#hS').textContent=H.score; sPop(); huntNext(); } else sClick(); }
function huntTick(){ if(!H||!H.running) return; const left=60000-(now()-H.t0); $('#hBar').style.width=Math.max(0,left/600)+'%'; $('#hT').textContent=fmtTime(left);
  if(left<=0){ H.running=false; clearInterval(H.timer); recordKeys(H.hits,H.misses); const isBest=H.score>(S.games.hunt||0); S.games.hunt=Math.max(S.games.hunt||0,H.score); save(); sDing();
    const o=$('#hO'); o.hidden=false; o.innerHTML=`<p class="ov-big">${neNum(H.score)}</p><p>You found ${H.score} letters with ${H.miss} wrong keys. ${isBest&&H.score?'That is your best yet.':`Your best is ${S.games.hunt}.`}</p><div class="cta" style="justify-content:center"><button class="btn primary" id="hGo">Play again</button><button class="btn" data-act="goGames">Other games</button></div>`; $('#hGo').onclick=huntGo; } }

// ---------- keyboard + writing pad ----------
function padInsert(ta,out){
  const s=ta.selectionStart, e=ta.selectionEnd; const before=ta.value.slice(0,s);
  let start=s, text=out; const comb=before+out;
  for(const [a,b] of RULES){ if(comb.endsWith(a)){ const back=a.length-out.length; if(back>=0&&back<=before.length){ start=s-back; text=b; } break; } }
  ta.focus(); ta.setSelectionRange(start,e);
  let ok=false; try{ ok=document.execCommand('insertText',false,text); }catch(err){}
  if(!ok){ ta.setRangeText(text,start,e,'end'); }
  padCount();
}
function padBack(ta){ const s=ta.selectionStart, e=ta.selectionEnd; ta.focus(); if(s!==e){ ta.setRangeText('',s,e,'end'); } else if(s>0){ ta.setSelectionRange(s-1,s); let ok=false; try{ ok=document.execCommand('delete'); }catch(err){} if(!ok) ta.setRangeText('',s-1,s,'end'); } padCount(); }
function padCount(){ const c=$('#padCount'), p=$('#pad'); if(c&&p) c.textContent=`${[...p.value].length} characters`; }
function padKeydown(e){ if(e.ctrlKey||e.metaKey||e.altKey) return; const k=keyOf(e); if(k==null) return; const out=KEYMAP[k]; if(out==null) return; e.preventDefault(); padInsert(e.target,out); kb&&kb.press(k); sClick(); }
function renderKeyboard(){
  const rows=[['आ','cf'],['ओ','cf]'],['औ','cf}'],['ई','O{'],['ो','f]'],['ौ','f}'],['ण','0f'],['क्ष','If'],['फ','km'],['झ','em'],['प्र','k|'],['कर्म','s{d']];
  main.innerHTML=`<div class="page-h"><h1 lang="ne">किबोर्ड र लेख्ने पाटी</h1><p class="sub">Keyboard and writing pad</p><p>Type here with your normal keyboard and it comes out as Nepali Unicode. Copy it into Facebook, Word, Gmail or anywhere else.</p></div>
  <div class="own"><textarea id="pad" class="pad" rows="5" lang="ne" spellcheck="false" autocomplete="off" aria-label="Writing pad" placeholder="यहाँ लेख्नुहोस्"></textarea>
  <div class="pad-bar"><span id="padCount" class="muted">0 characters</span><span class="spacer"></span><button class="btn small" data-act="padClear">Clear</button><button class="btn small primary" data-act="padCopy">Copy text</button></div></div>
  <div id="kbHost"></div>
  <p class="legend"><span><i style="background:var(--f-p)"></i>Little finger</span><span><i style="background:var(--f-r)"></i>Ring</span><span><i style="background:var(--f-m)"></i>Middle</span><span><i style="background:var(--f-i)"></i>Index</span><span><i style="background:var(--f-t)"></i>Thumb</span></p>
  <section style="margin-top:36px"><h2 class="sec-h">Keys that work together</h2><table class="tbl ref-tbl"><tbody>${rows.map(([o,k])=>`<tr><td lang="ne">${esc(o)}</td><td>${kbdSeqPlain(k)}</td></tr>`).join('')}</tbody></table>
  <h2 class="sec-h" style="margin-top:32px">Good to know</h2><ul class="notes">
   <li>Vowel signs are typed after their letter, even ि which appears before it: कि is S, then L.</li>
   <li>र् (Shift + [) is typed before the letter it sits on: धर्म is W, Shift + [, D.</li>
   <li>्र (Shift + \\) is typed after the letter it hangs from: प्र is K, then Shift + \\.</li>
   <li>Halanta (\\) turns any consonant into a half letter: त् is T, then \\.</li>
   <li>Nepali numerals are Shift plus the number keys. The number keys on their own type letters.</li>
   <li>Key positions match the Preeti font layout, so the skill carries over to Preeti and to Nepali Unicode "Traditional" keyboards you can install on your computer.</li></ul></section>`;
  const pad=$('#pad'); if(matchMedia('(pointer:coarse)').matches) pad.setAttribute('inputmode','none');
  pad.addEventListener('keydown',padKeydown); pad.addEventListener('input',padCount);
  mountKb($('#kbHost'),{size:'big',always:true,forceFingers:true,hands:false});
  consumer={key:k=>{ if(k==='Backspace'){ padBack(pad); return; } const out=KEYMAP[k]; if(out==null) return; padInsert(pad,out); kb.press(k); sClick(); }, enter:()=>padInsert(pad,'\n')};
}
function kbdSeqPlain(k){ return [...k].map(c=>`<kbd>${esc(labelFor(c))}</kbd>`).join(' then '); }
async function padCopy(){ const p=$('#pad'); if(!p||!p.value){ toast('Nothing to copy yet.'); return; } try{ await navigator.clipboard.writeText(p.value); toast('Copied. Paste it anywhere.'); }catch(e){ p.select(); try{ document.execCommand('copy'); toast('Copied. Paste it anywhere.'); }catch(e2){ toast('Select the text and copy it yourself.'); } } }

// ---------- router, events, settings ----------
const VIEWS={learn:renderLearn,practice:renderPractice,test:renderTest,quiz:renderQuiz,games:renderGames,keyboard:renderKeyboard};
function go(v){ if(!VIEWS[v]) v='learn'; stopAll(); view=v; setTab(v); VIEWS[v](); window.scrollTo(0,0); }
document.querySelector('.top').addEventListener('click',e=>{ const a=e.target.closest('[data-nav]'); if(!a) return; e.preventDefault(); const v=a.dataset.nav; if(location.hash.slice(1)===v) go(v); else location.hash=v; });
window.addEventListener('hashchange',()=>go(location.hash.slice(1)));
const ACTS={
  openLesson:b=>openLesson(b.dataset.id), beginLesson:b=>beginLesson(LESSON[b.dataset.id]), goLearn:()=>go('learn'), exitSess:()=>sess&&sess.back(),
  prac:b=>startPractice(b.dataset.k), pracOwn:()=>startOwn(), startTest:()=>startTest(),
  quizStart:b=>quizStart(b.dataset.t), qAns:b=>quizAnswer(+b.dataset.i), qNext:()=>quizNext(), goQuiz:()=>go('quiz'),
  rain:b=>startRain(b.dataset.m), race:b=>startRace(b.dataset.m), hunt:()=>startHunt(), goGames:()=>go('games'),
  padClear:()=>{ const p=$('#pad'); p.value=''; padCount(); p.focus(); }, padCopy:()=>padCopy()
};
main.addEventListener('click',e=>{ const b=e.target.closest('[data-act]'); if(!b||!main.contains(b)) return; const f=ACTS[b.dataset.act]; if(f){ e.preventDefault(); f(b,e); } });
document.addEventListener('keydown',e=>{
  if(e.ctrlKey||e.metaKey||e.altKey) return;
  const t=e.target; if(t&&t.id==='pad') return;
  if(t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.tagName==='SELECT'||t.isContentEditable)) return;
  if(document.querySelector('dialog[open]')) return;
  if(e.key==='Escape'){ if(consumer&&consumer.esc){ e.preventDefault(); consumer.esc(); } return; }
  if(e.key==='Enter'){ if(t&&(t.tagName==='BUTTON'||t.tagName==='A')) return; if(consumer&&consumer.enter){ e.preventDefault(); consumer.enter(); } return; }
  if(e.key==='Backspace'){ if(consumer&&consumer.key){ e.preventDefault(); consumer.key('Backspace'); } return; }
  const k=keyOf(e); if(k==null||!consumer||!consumer.key) return;
  e.preventDefault(); if(e.repeat) return;
  consumer.key(k);
});
window.addEventListener('resize',()=>board&&board.reposition());
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>board&&board.reposition());

function applySettings(){ const s=S.settings; document.body.classList.toggle('nokb',!s.kb); document.body.classList.toggle('nohands',!s.hands); document.body.classList.toggle('nofingers',!s.fingers); if(s.theme==='auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme',s.theme); }
const dlg=$('#setDlg'), form=$('#setForm');
$('#setBtn').addEventListener('click',()=>{ const s=S.settings; ['sound','kb','hands','fingers','unlockAll'].forEach(n=>form.elements[n].checked=!!s[n]); form.elements.theme.value=s.theme; if(dlg.showModal) dlg.showModal(); else dlg.setAttribute('open',''); });
form.addEventListener('change',()=>{ const s=S.settings; ['sound','kb','hands','fingers','unlockAll'].forEach(n=>s[n]=form.elements[n].checked); s.theme=form.elements.theme.value; save(); applySettings(); if(view==='learn') renderLearn(); });
$('#resetBtn').addEventListener('click',()=>{ if(confirm('Reset all lessons, scores and settings? This cannot be undone.')){ S=defState(); save(); applySettings(); dlg.close(); go('learn'); toast('Progress reset.'); } });

applySettings();
go(location.hash.slice(1)||'learn');
// ===== UI END =====
</script>
</body>
